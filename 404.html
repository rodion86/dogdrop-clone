<style>
  *{box-sizing:border-box;margin:0;padding:0}

       font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}

  .badge{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;

    text-decoration:none;background:linear-gradient(135deg,#FFC85C,#FF8A00);transition:.18s}
  a:hover{filter:brightness(1.07)}
  .note{margin-top:18px;font-size:10.5px;color:#4d5160}
</style>
</head>
